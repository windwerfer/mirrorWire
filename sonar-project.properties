sonar.projectKey=windwerfer_mirrorWire
sonar.organization=windwerfer

# Scan the crates, packaging/scripts, and GitHub Actions workflows.
# Keep build output and the lockfile out of the analysis.
sonar.sources=.
sonar.exclusions=target/**,**/target/**,Cargo.lock

# Official SonarCloud Rust properties (CI analysis only; Automatic Analysis
# cannot import these). Clippy JSON from `cargo clippy --message-format=json`.
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info

# Tests, docs and packaging scripts are not product-coverage targets.
sonar.coverage.exclusions=**/tests/**,**/*_tests.rs,**/tests.rs,scripts/**,packaging/**,.github/**,docs/**
