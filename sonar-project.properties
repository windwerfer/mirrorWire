sonar.projectKey=windwerfer_mirrorWire
sonar.organization=windwerfer

# Scan the crates, packaging/scripts, and GitHub Actions workflows.
# Keep build output and the lockfile out of the analysis.
# Do not set sonar.sources: SonarCloud's analysis-scope UX ignores it.
sonar.exclusions=target/**,**/target/**,Cargo.lock

# Official SonarCloud Rust properties (CI analysis only; Automatic Analysis
# cannot import these). Clippy JSON from `cargo clippy --message-format=json`.
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info

# Coverage exclusions. Tests, docs and packaging scripts are not
# product-coverage targets. Beyond that, only whole files that cannot run in
# a headless CI job (no compositor, GPU, display, system bus or Android
# device) are excluded; their testable decisions live in other files that
# stay measured (protocol, FEC, fragmentation, pairing/TLS, settings, cursor
# messages, firewall hint logic, encoder/decoder setup on the x264/software
# path, the presenter and viewer loops via the in-process loopback test).
#  - app/src/gui.rs, app/src/yuv_glow.rs: egui window code and the OpenGL
#    YUV shader; need a display and a GL context.
#  - media/src/source/portal.rs: xdg-desktop-portal + PipeWire screen
#    capture; needs a Wayland compositor and a user session.
#  - media/src/hw.rs: FFmpeg VAAPI / VideoToolbox device contexts; need a GPU.
#  - net/src/firewall/system.rs: firewalld D-Bus calls and firewall-cmd
#    processes; need a system bus with firewalld (the hint logic is in
#    firewall.rs and tested).
#  - android/src/{lib,app,codec}.rs: NativeActivity entry, Android egui UI
#    and NDK MediaCodec; only build for and run on an Android device.
sonar.coverage.exclusions=**/tests/**,**/*_tests.rs,**/tests.rs,scripts/**,packaging/**,.github/**,docs/**,\
  crates/mirrorwire-app/src/gui.rs,\
  crates/mirrorwire-app/src/yuv_glow.rs,\
  crates/mirrorwire-media/src/source/portal.rs,\
  crates/mirrorwire-media/src/hw.rs,\
  crates/mirrorwire-net/src/firewall/system.rs,\
  crates/mirrorwire-android/src/lib.rs,\
  crates/mirrorwire-android/src/app.rs,\
  crates/mirrorwire-android/src/codec.rs
