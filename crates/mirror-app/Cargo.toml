[package]
name = "mirror-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mirror"
path = "src/main.rs"

[features]
default = ["gui", "portal"]
gui = ["dep:eframe"]
portal = ["mirror-media/portal"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
clap = { version = "4", features = ["derive"] }
mirror-proto = { path = "../mirror-proto" }
mirror-media = { path = "../mirror-media" }
mirror-net = { path = "../mirror-net" }
eframe = { version = "0.37", optional = true, default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
