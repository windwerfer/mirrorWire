[package]
name = "mirrorwire-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
mirrorwire-proto = { path = "../mirrorwire-proto" }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"
hex = "0.4"
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"
hostname = "0.4"
dirs = "7"
getrandom = "0.3"
url = "2"

# Linux-only: talk to firewalld on the system bus (query + polkit-authenticated
# add-port). Same crate ashpd already pulls in for the presenter; gated so the
# Android viewer does not link it. Feature set matches a tokio app.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "tracing"] }

