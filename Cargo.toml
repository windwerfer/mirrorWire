[workspace]
resolver = "2"
members = ["crates/mirrorwire-proto", "crates/mirrorwire-media", "crates/mirrorwire-net", "crates/mirrorwire-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/windwerfer/mirrorWire"
# The binary is distributed as a Flatpak, AppImage or DMG, not as crates.io
# packages. This also lets cargo-deny treat in-tree path deps as private
# (allow-wildcard-paths) rather than as version = "*".
publish = false

[workspace.dependencies]
anyhow = "1"
bytes = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[profile.release]
debug = 1
