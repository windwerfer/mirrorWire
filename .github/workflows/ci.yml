name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    uses: ./.github/workflows/audit.yml

  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
            libavfilter-dev libswresample-dev libpipewire-0.3-dev libspa-0.2-dev libva-dev \
            libdbus-1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Loopback test (test pattern -> QUIC -> headless viewer)
        run: scripts/loopback-test.sh 5 --encoder x264
