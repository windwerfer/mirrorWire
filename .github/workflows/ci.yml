name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
            libavfilter-dev libswresample-dev libpipewire-0.3-dev libspa-0.2-dev libva-dev \
            libdbus-1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Loopback test (test pattern -> QUIC -> headless viewer)
        run: scripts/loopback-test.sh 5 --encoder x264
