name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            min_macos: '11.0'
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            min_macos: '10.13'
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}
      FFMPEG_PREFIX: ${{ github.workspace }}/.ffmpeg
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install nasm pkgconf || true
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: .ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ matrix.min_macos }}-${{ hashFiles('packaging/build-ffmpeg.sh') }}
      - name: Build static FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/build-ffmpeg.sh "$FFMPEG_PREFIX"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.min_macos }}
      - name: Build
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.ffmpeg/lib/pkgconfig
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p mirrorwire-app --no-default-features --features gui,static-ffmpeg
      - name: Bundle .app
        run: |
          packaging/macos/bundle.sh target/${{ matrix.target }}/release/mirrorwire \
            ${{ matrix.arch }} ${{ matrix.min_macos }} dist
      - name: Smoke test
        run: dist/MirrorWire.app/Contents/MacOS/mirrorwire --version
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorWire-macos-${{ matrix.arch }}
          path: dist/MirrorWire-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    # pipewire-rs 0.10 needs PipeWire >= 1.0 headers; Ubuntu 22.04 ships 0.3.48.
    runs-on: ubuntu-24.04
    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/.ffmpeg
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm pkg-config \
            clang libclang-dev libva-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev file
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: .ffmpeg
          key: ffmpeg-linux-ubuntu24-${{ hashFiles('packaging/build-ffmpeg.sh') }}
      - name: Build static FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/build-ffmpeg.sh "$FFMPEG_PREFIX"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage
      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/.ffmpeg/lib/pkgconfig
        run: cargo build --release --locked -p mirrorwire-app --features static-ffmpeg
      - name: Smoke test
        run: target/release/mirrorwire --version && ldd target/release/mirrorwire
      - name: Package AppImage
        run: packaging/appimage/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorWire-x86_64.AppImage
          path: dist/MirrorWire-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: MirrorWire-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.windwerfer.MirrorWire.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorWire-x86_64.flatpak
          path: MirrorWire-x86_64.flatpak
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" --title "MirrorWire ${GITHUB_REF_NAME}" --generate-notes
